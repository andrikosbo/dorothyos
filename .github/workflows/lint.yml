name: lint
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f" || exit 1; done
      - name: python syntax
        run: |
          for f in $(git ls-files '*.py'); do python3 -m py_compile "$f" || exit 1; done
      - name: JSON metadata
        run: |
          for f in $(git ls-files '*metadata.json' '*.json'); do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || exit 1; done
      - name: tree audit (secrets, personal data, licences)
        run: sh tests/audit.sh
