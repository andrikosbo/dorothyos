# DorothyOS branding values — the single source for os-release, /etc/issue, motd and the About page.
# Shell syntax; read by dorothyos-branding-apply.  Change here, rebuild the package.
DOROTHYOS_NAME="DorothyOS"
DOROTHYOS_ID="dorothyos"
DOROTHYOS_RELEASE="0.1.0-rc1"          # shown to the user (os-release VERSION)
DOROTHYOS_VERSION_ID="0.1.0"
DOROTHYOS_VARIANT="Xiaomi Pad 6"
DOROTHYOS_TAGLINE="a tablet-first Linux for the Xiaomi Pad 6"
DOROTHYOS_ANSI_COLOR="38;2;253;109;0"
# URLs: the project website is public; support and bug-report URLs stay empty until the repository is published.
DOROTHYOS_HOME_URL="https://dorothy.gr/dorothyos"
DOROTHYOS_SUPPORT_URL=""
DOROTHYOS_BUG_URL=""
